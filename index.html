<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>हनुमान चालीसा · Hanuman Chalisa — Line by Line</title>
  <meta name="description" content="An animated, line-by-line recitation of the Hanuman Chalisa in Devanagari and transliteration." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Cinzel:wght@500;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient background layers -->
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-rays" aria-hidden="true"></div>
  <div class="embers" id="embers" aria-hidden="true"></div>

  <main class="stage">
    <header class="topbar">
      <div class="om" aria-hidden="true">ॐ</div>
      <div class="titles">
        <h1 class="title-hi">हनुमान चालीसा</h1>
        <p class="title-en">Hanuman Chalisa</p>
      </div>
      <button id="textToggle" class="lang-toggle ghost-toggle" title="Show / hide verse text (T)">
        <span data-text-label>पाठ · Text</span>
      </button>
      <button id="langToggle" class="lang-toggle" title="Toggle language">
        <span data-lang-label>दोनों · Both</span>
      </button>
    </header>

    <!-- Verse display: scene on one side, verse text on the other -->
    <section class="verse-wrap" aria-live="polite">
      <!-- Animated scene that acts out the verse meaning -->
      <div class="scene-col">
        <div class="scene-stage" id="sceneStage"></div>
        <div class="scene-desc" id="sceneDesc"></div>
      </div>

      <div class="text-col">
        <div class="verse-card" id="verseCard">
          <div class="verse-badge" id="verseBadge">दोहा</div>
          <div class="verse-hi" id="verseHi"></div>
          <div class="verse-en" id="verseEn"></div>
        </div>
        <div class="counter" id="counter">1 / 1</div>
      </div>
    </section>

    <!-- Audio bar -->
    <section class="audiobar" id="audioBar">
      <audio id="audio" preload="metadata"></audio>

      <label class="audio-load" title="Load a recitation audio file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
        <span id="audioLoadLabel">Load recitation</span>
        <input type="file" id="audioFile" accept="audio/*" hidden />
      </label>

      <span class="audio-time" id="audioTime">0:00 / 0:00</span>

      <button id="calibrateBtn" class="audio-cal" title="Tap along to build the sync timings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4zm7 10a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11z"/></svg>
        <span>Calibrate</span>
      </button>

      <span class="audio-hint" id="audioHint">No track loaded — using timed auto-advance.</span>
    </section>

    <!-- Calibration overlay -->
    <div class="cal-panel" id="calPanel" hidden>
      <div class="cal-inner">
        <h2>Sync Calibration</h2>
        <p class="cal-step" id="calStep">Press <b>Load recitation</b> first, then start.</p>
        <div class="cal-now" id="calNow"></div>
        <div class="cal-actions">
          <button id="calTap" class="cal-tap" title="Tap at the start of this verse (Space)">Tap ⏎ / Space</button>
          <button id="calUndo" class="cal-ghost">Undo</button>
          <button id="calFinish" class="cal-ghost">Finish</button>
          <button id="calCancel" class="cal-ghost">Cancel</button>
        </div>
        <div class="cal-output" id="calOutput" hidden>
          <p>Done! Copy these into <code>timings.js</code>, or download the file.</p>
          <textarea id="calText" readonly spellcheck="false"></textarea>
          <div class="cal-actions">
            <button id="calCopy" class="cal-tap">Copy</button>
            <button id="calDownload" class="cal-ghost">Download timings.js</button>
            <button id="calUse" class="cal-ghost">Use now (this session)</button>
            <button id="calClose" class="cal-ghost">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <section class="controls">
      <div class="progress" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="buttons">
        <button id="prevBtn" class="ctrl" title="Previous (←)" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M15 5v14l-9-7z"/><rect x="5" y="5" width="2.4" height="14" rx="1"/></svg>
        </button>
        <button id="playBtn" class="ctrl ctrl-primary" title="Play / Pause (Space)" aria-label="Play or pause">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>
        </button>
        <button id="nextBtn" class="ctrl" title="Next (→)" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9 5v14l9-7z"/><rect x="16.6" y="5" width="2.4" height="14" rx="1"/></svg>
        </button>
        <button id="restartBtn" class="ctrl" title="Restart (R)" aria-label="Restart">
          <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
        </button>
      </div>

      <div class="speed">
        <span class="speed-label">गति · Pace</span>
        <input type="range" id="speed" min="3" max="12" step="0.5" value="6.5" />
        <span class="speed-val" id="speedVal">6.5s</span>
      </div>
    </section>

    <footer class="foot">
      <span>॥ श्री हनुमते नमः ॥</span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="timings.js"></script>
  <script src="scenes.js"></script>
  <script src="script.js"></script>
</body>
</html>
